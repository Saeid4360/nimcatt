  <script src="./data/news.js?v=desk-20260924"></script>
  <script>
  (()=>{

    const stop=new Set('the and for with from into that this have has was were after before about says report latest live football soccer team club player'.split(' ')),tokens=x=>new Set(norm(x.title).split(/\s+/).filter(w=>w.length>2&&!stop.has(w))),hash=s=>{let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)},similarity=(a,b)=>{const shared=[...a.t].filter(x=>b.t.has(x));return shared.length?shared.length/new Set([...a.t,...b.t]).size:0},cat=v=>({news:'خبر',transfer:'نقل‌وانتقالات',analysis:'تحلیل'})[v]||'خبر',sourceWeight={club:6,major:5,analysis:4,local:3,fan:1};
    function makeTopics(){const rows=news.map(item=>({item,t:tokens(item)})).sort((a,b)=>new Date(b.item.publishedAt)-new Date(a.item.publishedAt)),clusters=[];for(const row of rows){let best=null,score=0;for(const c of clusters){if(Math.abs(new Date(row.item.publishedAt)-new Date(c[0].item.publishedAt))/36e5>72)continue;const s=Math.max(...c.slice(0,8).map(x=>similarity(row,x)));if(s>score){score=s;best=c}}if(best&&score>=(row.t.size>5?.28:.38))best.push(row);else clusters.push([row])}topics=clusters.map(c=>buildTopic(c.map(x=>x.item))).sort((a,b)=>b.score-a.score||new Date(b.publishedAt)-new Date(a.publishedAt));if(!topics.some(t=>t.id===selected))selected=topics[0]?.id||null}
    function buildTopic(items){const ordered=[...items].sort((a,b)=>(sourceWeight[b.sourceType]||2)-(sourceWeight[a.sourceType]||2)||new Date(b.publishedAt)-new Date(a.publishedAt)),lead=ordered[0],sources=[...new Set(items.map(x=>x.source))],types=new Set(items.map(x=>x.sourceType)),newest=items.reduce((v,x)=>new Date(x.publishedAt)>new Date(v)?x.publishedAt:v,items[0].publishedAt),age=Math.max(0,(Date.now()-new Date(newest))/36e5),freshness=age<=3?25:age<=8?22:age<=24?18:age<=48?12:6,reliability=Math.min(20,Math.max(...items.map(x=>({club:20,major:18,analysis:16,local:13,fan:7}[x.sourceType]||10)))+Math.min(3,sources.length-1)),text=norm(items.map(x=>`${x.title} ${x.summary}`).join(' ')),impact=Math.min(20,8+(text.match(/official|confirm|injur|contract|transfer|final|derby|رسمی|مصدوم|قرارداد|انتقال|فینال|دربی/g)||[]).length*3),audience=Math.min(15,7+(text.match(/arsenal|chelsea|liverpool|madrid|barcelona|bayern|messi|ronaldo|آرسنال|چلسی|لیورپول|رئال|بارسلونا|مسی|رونالدو/g)||[]).length*3),evidence=Math.min(10,4+sources.length*2),formatFit=Math.min(10,5+(items.some(x=>x.image)?3:0)+(lead.summary?2:0));let penalty=0,warnings=[];if(types.size===1&&types.has('fan')){penalty+=15;warnings.push('سوژه فقط منبع هواداری دارد و نباید قطعی منتشر شود.')}else if(sources.length===1){penalty+=4;warnings.push('خبر تک‌منبعی است؛ برای ادعاهای حساس تأیید دوم بگیرید.')}if(items.some(x=>x.needsTranslation)){penalty+=3;warnings.push('متن به ترجمه و بازبینی فارسی نیاز دارد.')}const score=Math.max(0,Math.min(100,Math.round(freshness+reliability+impact+audience+evidence+formatFit-penalty))),risk=penalty>=12?'زیاد':sources.length>=2&&types.has('major')?'کم':'متوسط';return{id:'topic-'+hash(items.map(x=>x.id||x.url).sort().join('|')),title:lead.title,summary:lead.summary||'',category:lead.cat||'news',publishedAt:newest,score,risk,confidence:risk==='کم'?'بالا':risk==='زیاد'?'پایین':'متوسط',sources,warnings,articles:items.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)),factors:{تازگی:[freshness,25],اعتبار:[reliability,20],ارزش‌خبری:[impact,20],تناسب‌مخاطب:[audience,15],شواهد:[evidence,10],چندفرمی:[formatFit,10]}}}
    function setView(next){view=['reader','evaluator','editorial'].includes(next)?next:'reader';$$('.view').forEach(x=>x.classList.toggle('hidden',x.id!==view+'View'));$$('.step').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const copy={reader:['پایش منابع','خبرهای تازه فوتبال در یک جریان واحد'],evaluator:['تصمیم‌یار تحریریه','کدام سوژه ارزش کار کردن دارد؟'],editorial:['تولید ساختاریافته','از سوژه منتخب تا پیش‌نویس استاندارد']}[view];$('#eyebrow').textContent=copy[0];$('#heroTitle').textContent=copy[1];history.replaceState(null,'','#'+view);if(view!=='reader')renderTopics()}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});function sync(){const healthy=(meta.sources||[]).filter(x=>x.ok).length||new Set(news.map(x=>x.source)).size;$('#mNews').textContent=fa.format(news.length);$('#mTopics').textContent=fa.format(topics.length);$('#mSources').textContent=fa.format(healthy)}

    function renderTopics(){for(const id of ['evaluatorView','editorialView']){const root=$('#'+id),rows=filteredTopics(root);root.querySelector('.queue').innerHTML=rows.length?rows.map(topicCard).join(''):'<div class="empty">سوژه‌ای پیدا نشد.</div>';root.querySelector('.topicCount').textContent=`${fa.format(rows.length)} از ${fa.format(topics.length)} سوژه`}renderEvaluation();renderEditorial()}
    $$('.topicSearch,.topicScore,.topicRisk').forEach(x=>x.addEventListener(x.matches('.topicSearch')?'input':'change',renderTopics));$$('.queue').forEach(q=>q.addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(b){selected=b.dataset.topic;renderTopics()}}));const head=t=>`<div class="panel-head"><small>امتیاز ${fa.format(t.score)} از ۱۰۰ · اطمینان ${t.confidence}</small><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p></div>`,sources=t=>t.articles.slice(0,8).map(a=>`<div class="source"><span><b>${esc(a.source)}</b><br>${esc(a.title)}</span><a href="${esc(safe(a.url))}" target="_blank" rel="noopener">منبع ↗</a></div>`).join('');
    function renderEvaluation(){const t=topics.find(x=>x.id===selected),p=$('#evaluationPanel');if(!t){p.innerHTML='<div class="empty">یک سوژه انتخاب کنید.</div>';return}p.innerHTML=head(t)+`<div class="panel-body"><div class="label">دلایل امتیاز</div>${Object.entries(t.factors).map(([k,[v,max]])=>`<div class="factor"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${fa.format(v)}</b></div>`).join('')}<div class="label">کنترل ریسک</div>${t.warnings.length?t.warnings.map(x=>`<div class="warning">${esc(x)}</div>`).join(''):'<div class="check">مانع مهمی شناسایی نشد</div>'}<div class="label">شواهد</div>${sources(t)}<button class="cta" data-view="editorial">ارسال به میز تحریریه ←</button></div>`}
    const clean=x=>String(x||'').replace(/\s+/g,' ').trim();function draft(t,type){const source=t.sources.join('، '),lead=`براساس گزارش ${source}، ${clean(t.summary||t.title)}`,uncertain=t.risk==='کم'?'':'این اطلاعات هنوز به تأیید مستقل بیشتری نیاز دارد.';if(type==='breaking')return{label:'خبر فوری',title:t.title,dek:t.summary,sections:[['',`${lead} ${uncertain}`]]};if(type==='telegram')return{label:'تلگرام',title:`⚽ ${t.title}`,dek:'',sections:[['',`${lead}\n\n${uncertain}\n\nمنابع: ${source}`]]};if(type==='instagram')return{label:'اینستاگرام',title:t.title,dek:'',sections:[['',`${clean(t.summary)}\n\nاین سوژه با امتیاز ${t.score} از ۱۰۰ در صف تحریریه قرار گرفته است. ${uncertain}\n\n#فوتبال #نیمکت`]]};if(type==='video')return{label:'سناریوی ویدئو',title:t.title,dek:'ویدئوی ۶۰ ثانیه‌ای',sections:[['هوک',t.title],['روایت',lead],['جمع‌بندی',`${uncertain} برای تازه‌ترین جزئیات، منابع اصلی را دنبال کنید.`]]};if(type==='analysis')return{label:'طرح تحلیل',title:t.title,dek:'محورهای پیشنهادی برای تحلیل مستند',sections:[['مسئله اصلی',clean(t.summary)],['شواهد قابل استفاده',`${t.articles.length} گزارش از ${t.sources.length} منبع در این خوشه وجود دارد.`],['پرسش تحلیلی','این اتفاق چه اثری بر تصمیم‌های فنی، مدیریتی یا نقل‌وانتقالاتی خواهد داشت؟'],['محدودیت',uncertain]]};return{label:'خبر کامل',title:t.title,dek:t.summary,sections:[['اصل خبر',lead],['آنچه می‌دانیم',t.articles.slice(0,3).map(a=>clean(a.summary||a.title)).join(' ')],['چرا مهم است',`این سوژه با امتیاز فرصت ${t.score} از ۱۰۰ ارزیابی شده و از نظر تحریریه در سطح ${t.score>=75?'فوری':t.score>=60?'ارزش کار':'رصد'} قرار دارد.`],['مرحله بعد',`${uncertain} تحریریه باید پیش از انتشار نهایی، نام‌ها، اعداد و نقل‌قول‌ها را با لینک منابع تطبیق دهد.`]]}}
    function renderEditorial(){const t=topics.find(x=>x.id===selected),p=$('#editorialPanel');if(!t){p.innerHTML='<div class="empty">یک سوژه برای تولید انتخاب کنید.</div>';return}const d=draft(t,format),buttons=[['full','خبر کامل'],['breaking','فوری'],['telegram','تلگرام'],['instagram','اینستاگرام'],['video','ویدئو'],['analysis','تحلیل']];p.innerHTML=head(t)+`<div class="panel-body"><div class="label">قالب خروجی</div><div class="format-row">${buttons.map(([id,l])=>`<button class="${id===format?'active':''}" data-format="${id}">${l}</button>`).join('')}</div><article class="preview"><div class="pretitle">${d.label}</div><h1>${esc(d.title)}</h1>${d.dek?`<div class="dek">${esc(d.dek)}</div>`:''}${d.sections.map(([h,text])=>`${h?`<h2>${esc(h)}</h2>`:''}${String(text).split('\n').filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}`).join('')}</article><div class="label">کنترل استاندارد نگارش</div><div class="checks"><div class="check">تیتر روشن و بدون ادعای تازه</div><div class="check">پاراگراف‌های کوتاه و تک‌موضوعی</div><div class="check">منبع در لید ذکر شده است</div><div class="check">عدم قطعیت برای ریسک متوسط یا زیاد نمایش داده شده است</div><div class="check">خروجی از داده منبع ساخته شده، نه HTML آزاد</div></div><button class="copy" id="copyDraft">کپی خروجی</button><div class="label">منابع متصل</div>${sources(t)}</div>`}
    $('#editorialPanel').addEventListener('click',async e=>{const f=e.target.closest('[data-format]');if(f){format=f.dataset.format;renderEditorial();return}if(e.target.id==='copyDraft'){await navigator.clipboard.writeText($('.preview').innerText);e.target.textContent='کپی شد ✓'}});function merge(incoming){const seen=new Set;news=[...incoming,...news].filter(x=>{const k=x.url||x.id;if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,800)}
    let retry=0,retryTimer,pollTimer;async function load(force=false){clearTimeout(retryTimer);clearTimeout(pollTimer);const s=$('#status'),b=$('#refresh');b.disabled=true;s.textContent='در حال اتصال به سامانه خبر…';try{const r=await fetch(`/api/news-feed?limit=800${force?'&refresh=1':''}`,{cache:'no-store'});if(!r.ok)throw Error(r.status);const data=await r.json();if(Array.isArray(data.news))merge(data.news);if(data.meta)meta=data.meta;makeTopics();sync();renderNews();renderTopics();const waiting=['refreshing','stale','warming'].includes(data.cacheStatus),updated=meta.generatedAt?new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Tehran'}).format(new Date(meta.generatedAt)):'';s.textContent=waiting?`آرشیو متصل است؛ دریافت تازه ادامه دارد · ${updated}`:`هر سه سامانه فعال‌اند · آخرین دریافت ${updated}`;s.className='status '+(waiting?'warn':'ok');if(waiting&&retry<8){retry++;retryTimer=setTimeout(()=>load(false),5000)}else retry=0}catch{s.textContent='سرور خبر در دسترس نیست؛ npm run dev را اجرا کنید.';s.className='status error'}finally{b.disabled=false;b.textContent='دریافت خبر تازه';pollTimer=setTimeout(()=>load(false),60000)}}
    $('#refresh').addEventListener('click',()=>{retry=0;load(true)});makeTopics();sync();renderNews();renderTopics();setView(location.hash.slice(1)||'reader');load(false);
  })();
  </script>
